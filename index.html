<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý công việc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✅%3C/text%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme-v1")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7385;--bd:#e5e8ef;--ac:#5b5bf0;--ok:#22a06b;--warn:#d97706;--bad:#dc2626;--soft:#f0f1f7;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0f1117;--card:#171a23;--tx:#e8eaf2;--mu:#8c93a6;--bd:#262a37;--ac:#8087ff;--ok:#3fcf8e;--warn:#f0a23b;--bad:#f26d6d;--soft:#1e2230;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .25s}
.app{max-width:820px;margin:0 auto;padding:24px 16px 80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.hs{margin:2px 0 0;color:var(--mu);font-size:14px}
.tools{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);font-size:16px;transition:.15s}
.ib:hover{transform:translateY(-1px);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.st b{font-size:24px;line-height:1.1;display:block}
.st span{color:var(--mu);font-size:12px}
.st.bad b{color:var(--bad)}
.ring{flex:none}
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick input{flex:1;min-width:0;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);transition:.15s}
.quick input:focus,.fld:focus,.modal input:focus,.modal textarea:focus,.modal select:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:500;transition:.15s}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;margin-bottom:10px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;color:var(--mu);font-weight:600;transition:.15s}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fld{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
#s{flex:1;min-width:140px}
.dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dbar .cnt{margin-left:auto;color:var(--mu);font-size:13px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pc,var(--bd));border-radius:14px;padding:12px 12px 12px 8px;box-shadow:var(--sh);transition:transform .2s,opacity .28s,box-shadow .2s}
.card:hover{box-shadow:0 2px 4px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.1)}
.card.fresh{animation:in .3s both}
.card.leaving{opacity:0;transform:translateX(28px)}
.card.dragging{box-shadow:0 14px 34px rgba(0,0,0,.28);outline:2px solid var(--ac);position:relative;z-index:3;transform:scale(1.01)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.h{cursor:grab;color:var(--mu);touch-action:none;user-select:none;padding:2px 2px;opacity:.45;line-height:1.5}
.card:hover .h{opacity:1}
.ck{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--mu);background:none;margin-top:1px;display:grid;place-items:center;transition:.15s;padding:0}
.ck:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff;font-size:13px;cursor:default}
.main{flex:1;min-width:0}
.ttl{font-weight:600;word-break:break-word}
.card.done .ttl{color:var(--mu);text-decoration:line-through}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bdg.over{--c:var(--bad)}.bdg.today{--c:var(--warn)}.bdg.plain{--c:var(--mu)}
.desc{color:var(--mu);font-size:14px;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.subs{margin-top:8px}
.prog{height:5px;background:var(--soft);border-radius:9px;overflow:hidden;max-width:220px;margin-bottom:5px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.sub{display:flex;gap:8px;align-items:center;font-size:14px;padding:2px 0}
.sub input{accent-color:var(--ok);width:16px;height:16px;margin:0}
.sub.d span{text-decoration:line-through;color:var(--mu)}
.acts{display:flex;gap:2px;flex:none}
.acts button{border:0;background:none;width:30px;height:30px;border-radius:8px;color:var(--mu);font-size:15px;transition:.15s}
.acts button:hover{background:var(--soft);color:var(--tx)}
.acts .x:hover{color:var(--bad)}
.empty{text-align:center;padding:50px 16px;color:var(--mu)}
.empty big{display:block;font-size:40px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:20;animation:fade .15s}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:520px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:in .2s}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 14px;font-size:19px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 5px}
.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal textarea,.modal select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.modal textarea{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-weight:600;font-size:13px;transition:.15s}
.seg button.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c);color:var(--c)}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.srow input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);flex:none}
.srow button{border:0;background:none;color:var(--mu);font-size:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30;animation:in .2s;font-size:14px}
.toast button{background:none;border:0;color:#9db0ff;font-weight:700}
.pops{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:40;width:min(340px,calc(100vw - 32px));pointer-events:none}
.pop{pointer-events:auto;position:relative;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pc,var(--ac));border-radius:14px;padding:12px 34px 12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:slideL .35s cubic-bezier(.2,.9,.3,1.2);transition:opacity .3s,transform .3s}
.pop.out{opacity:0;transform:translateX(-120%)}
.pop .px{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mu);font-size:20px;line-height:1}
.pt{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:2px}
.pn{font-weight:600;word-break:break-word}
.pm{color:var(--mu);font-size:13px;margin-top:2px}
.pa{display:flex;gap:6px;margin-top:8px}
@keyframes slideL{from{opacity:0;transform:translateX(-120%)}}
[hidden]{display:none!important}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.quick .btn:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Quản lý công việc</h1><p class="hs" id="sub"></p></div>
    <div class="tools">
      <button class="ib" id="bell" title="Cài đặt nhắc việc">🔔</button>
      <button class="ib" id="theme" title="Đổi sáng/tối">◐</button>
      <button class="ib" id="exp" title="Sao lưu ra file">⤓</button>
      <button class="ib" id="imp" title="Khôi phục từ file">⤒</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="quick">
    <input id="q" placeholder="Thêm nhanh một việc rồi nhấn Enter…  (phím tắt: N)" maxlength="120" autocomplete="off">
    <button class="btn pri" id="qAdd">Thêm</button>
    <button class="btn" id="qMore">Chi tiết</button>
  </div>
  <div class="tabs"><button id="vOpen" class="on"></button><button id="vDone"></button></div>
  <div class="filters">
    <input class="fld" id="s" placeholder="🔍 Tìm kiếm  ( / )">
    <select class="fld" id="fp"><option value="">Mọi ưu tiên</option><option value="3">Gấp</option><option value="2">Cao</option><option value="1">Vừa</option><option value="0">Thấp</option></select>
    <select class="fld" id="fc"></select>
    <select class="fld" id="so"><option value="manual">Thứ tự kéo thả</option><option value="due">Theo hạn chót</option><option value="pri">Theo ưu tiên</option><option value="new">Mới nhất</option></select>
    <button class="btn sm" id="fx" hidden>Xóa lọc</button>
  </div>
  <div class="dbar" id="dbar" hidden>
    <button class="btn sm" id="prev">‹</button><input class="fld" type="date" id="day" style="padding:4px 8px">
    <button class="btn sm" id="next">›</button><button class="btn sm" id="tdy">Hôm nay</button><button class="btn sm" id="all">Tất cả</button>
    <span class="cnt" id="cnt"></span><button class="btn sm" id="clr">Xóa</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2 id="mh">Việc mới</h2>
    <label>Tiêu đề</label><input type="text" id="mt" maxlength="120" placeholder="Bạn cần làm gì?">
    <label>Miêu tả chi tiết</label><textarea id="md" maxlength="1500" placeholder="Ghi chú, link, yêu cầu…"></textarea>
    <label>Mức ưu tiên</label><div class="seg" id="mp"></div>
    <div class="g2"><div><label>Phân loại</label><select id="mc"></select></div><div><label>Người thêm</label><input type="text" id="mby" list="bys" maxlength="40" placeholder="Tên người thêm"></div></div><datalist id="bys"></datalist>
    <div class="g2"><div><label>Hạn chót (ngày)</label><input type="date" id="mdue"></div><div><label>Giờ hạn chót</label><input type="time" id="mtime"></div></div>
    <label>Việc con (checklist)</label><div id="ms"></div>
    <input type="text" id="msn" placeholder="+ Thêm việc con rồi nhấn Enter" maxlength="100">
    <div class="foot"><button class="btn" id="mx">Hủy</button><button class="btn pri" id="mok">Lưu</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="pops" id="pops"></div>
<div class="modal" id="smodal" hidden>
  <div class="sheet">
    <h2>Cài đặt nhắc việc</h2>
    <label>Tên của bạn (tự điền vào mục “Người thêm”)</label>
    <input type="text" id="sname" maxlength="40" placeholder="Ví dụ: Đạt">
    <label>Popup nhắc việc chưa hoàn thành</label>
    <select id="sint"><option value="0">Tắt</option><option value="30">Mỗi 30 giây</option><option value="60">Mỗi 1 phút</option><option value="300">Mỗi 5 phút</option><option value="900">Mỗi 15 phút</option><option value="1800">Mỗi 30 phút</option><option value="3600">Mỗi 1 giờ</option></select>
    <label>Thông báo của máy tính (khi bạn đang ở tab hoặc ứng dụng khác)</label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" id="ssysbtn" type="button">Bật thông báo</button><span id="ssys" style="color:var(--mu);font-size:13px"></span></div>
    <div class="foot"><button class="btn" id="stest" type="button">Xem thử</button><button class="btn" id="sx" type="button">Đóng</button><button class="btn pri" id="sok" type="button">Lưu</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),list=$("list");
const PRI=[["Thấp","#22a06b"],["Vừa","#3b82f6"],["Cao","#d97706"],["Gấp","#dc2626"]];
const CAT={work:["Công việc","#6e56cf"],me:["Cá nhân","#0e9aa7"],study:["Học tập","#d6409f"],health:["Sức khỏe","#22a06b"],other:["Khác","#6e7781"]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
let tasks=load("tasks-v2",[]),history=load("history-v2",[]),counter=load("counter-v3",0),ui=load("ui-v1",{sort:"manual"});
let view="open",day=dk(Date.now()),Q="",fP="",fC="",animAll=true,freshId=null,editId=null,mPri=1,mSubs=[],tmr;
[...tasks,...history].forEach(x=>{x.num||(x.num=++counter);x.created||(x.created=x.doneAt||Date.now());x.pri??(x.pri=1);x.cat??(x.cat="");x.due??(x.due="");x.dueTime??(x.dueTime="");x.by??(x.by="");x.subs??(x.subs=[])});
function save(){try{localStorage.setItem("tasks-v2",JSON.stringify(tasks));localStorage.setItem("history-v2",JSON.stringify(history));localStorage.setItem("counter-v3",JSON.stringify(counter));localStorage.setItem("ui-v1",JSON.stringify(ui))}catch(e){}}
ui.int??(ui.int=30);ui.by??(ui.by="");save();
$("so").value=ui.sort||"manual";
$("fc").innerHTML='<option value="">Mọi phân loại</option>'+Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
$("mc").innerHTML='<option value="">Không phân loại</option>'+Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");

function toast(msg,undo){
  const t=$("toast");clearTimeout(tmr);t.hidden=false;t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button>Hoàn tác</button>':"");
  if(undo)t.querySelector("button").onclick=()=>{undo();t.hidden=true;save();render()};
  tmr=setTimeout(()=>t.hidden=true,5000);
}
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const isOver=t=>!!t.due&&(t.due<dk(Date.now())||(t.due===dk(Date.now())&&!!t.dueTime&&t.dueTime<nowHM()));
function dueInfo(due,time){
  const a=new Date(due+"T00:00:00"),b=new Date(dk(Date.now())+"T00:00:00"),n=Math.round((a-b)/864e5),tm=time?" "+time:"";
  if(n<0)return["over","Quá hạn "+(-n)+" ngày"];
  if(n===0)return[isOver({due,dueTime:time})?"over":"today",(isOver({due,dueTime:time})?"Quá hạn từ ":"Hôm nay ")+(time||"")];
  if(n===1)return["plain","Ngày mai"+tm];
  return["plain",due.split("-").reverse().slice(0,2).join("/")+tm];
}
const hm=ts=>new Date(ts).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"});
function match(t){
  if(fP!==""&&String(t.pri)!==fP)return false;
  if(fC&&t.cat!==fC)return false;
  if(Q){const h=(t.title+" "+t.desc+" "+(t.by||"")+" "+t.subs.map(s=>s.text).join(" ")).toLowerCase();if(!h.includes(Q))return false}
  return true;
}
const dkey=t=>t.due?t.due+" "+(t.dueTime||"99:99"):"9999";
function sorted(a){
  const s=ui.sort,r=[...a];
  if(s==="due")r.sort((x,y)=>dkey(x)<dkey(y)?-1:dkey(x)>dkey(y)?1:y.pri-x.pri);
  else if(s==="pri")r.sort((x,y)=>y.pri-x.pri||dkey(x).localeCompare(dkey(y)));
  else if(s==="new")r.sort((x,y)=>y.created-x.created);
  return r;
}
function card(t,closed,canDrag){
  const bd=[];
  if(t.cat&&CAT[t.cat])bd.push(`<span class="bdg" style="--c:${CAT[t.cat][1]}">${CAT[t.cat][0]}</span>`);
  bd.push(`<span class="bdg" style="--c:${PRI[t.pri][1]}">${PRI[t.pri][0]}</span>`);
  if(t.due){const[c,l]=closed?["plain",t.due.split("-").reverse().slice(0,2).join("/")+(t.dueTime?" "+t.dueTime:"")]:dueInfo(t.due,t.dueTime);bd.push(`<span class="bdg ${c}">⏰ ${l}</span>`)}
  if(t.by)bd.push(`<span class="bdg plain">👤 ${esc(t.by)}</span>`);
  bd.push(`<span class="bdg plain">#${t.num}</span>`);
  if(closed)bd.push(`<span class="bdg plain">✓ ${hm(t.doneAt)}</span>`);
  const ds=t.subs.filter(s=>s.done).length,n=t.subs.length;
  const subs=n?`<div class="subs"><div class="prog"><i style="width:${ds/n*100}%"></i></div>`+t.subs.map(s=>`<label class="sub ${s.done?"d":""}"><input type="checkbox" data-act="sub" data-sid="${s.id}" ${s.done?"checked":""} ${closed?"disabled":""}><span>${esc(s.text)}</span></label>`).join("")+`</div>`:"";
  return `<li class="card ${closed?"done":""} ${(animAll||t.id===freshId)?"fresh":""}" data-id="${t.id}" style="--pc:${PRI[t.pri][1]}">`
   +(canDrag?'<span class="h" title="Kéo để sắp xếp">⋮⋮</span>':'<span style="width:8px"></span>')
   +(closed?'<button class="ck on">✓</button>':'<button class="ck" data-act="done" title="Hoàn thành"></button>')
   +`<div class="main"><div class="ttl">${esc(t.title)}</div><div class="badges">${bd.join("")}</div>${t.desc?`<div class="desc">${esc(t.desc)}</div>`:""}${subs}</div>`
   +`<div class="acts">${closed?'<button data-act="reopen" title="Mở lại">↺</button>':'<button data-act="edit" title="Sửa">✎</button>'}<button class="x" data-act="del" title="Xóa">🗑</button></div></li>`;
}
function render(){
  const td=dk(Date.now()),doneT=history.filter(h=>dk(h.doneAt)===td).length,total=doneT+tasks.length,pct=total?Math.round(doneT/total*100):0;
  const over=tasks.filter(isOver).length,dueT=tasks.filter(t=>t.due===td).length;
  $("sub").textContent=new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+(tasks.length?` · còn ${tasks.length} việc`:" · bạn đã xong hết 🎉");
  $("stats").innerHTML=`<div class="st"><svg class="ring" width="52" height="52" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="var(--soft)" stroke-width="7"/><circle cx="30" cy="30" r="25" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="157.1" stroke-dashoffset="${157.1*(1-pct/100)}" transform="rotate(-90 30 30)" style="transition:stroke-dashoffset .5s"/></svg><div><b>${pct}%</b><span>Xong hôm nay (${doneT}/${total})</span></div></div>`
   +`<div class="st"><div><b>${tasks.length}</b><span>Đang cần làm</span></div></div><div class="st"><div><b>${dueT}</b><span>Đến hạn hôm nay</span></div></div><div class="st ${over?"bad":""}"><div><b>${over}</b><span>Quá hạn</span></div></div>`;
  $("vOpen").textContent=`Cần làm (${tasks.length})`;$("vDone").textContent=`Hoàn thành (${history.length})`;
  $("vOpen").className=view==="open"?"on":"";$("vDone").className=view==="done"?"on":"";
  $("so").hidden=view!=="open";$("dbar").hidden=view!=="done";
  const filt=Q||fP!==""||fC;$("fx").hidden=!filt;
  const shownDone=history.filter(h=>(!day||dk(h.doneAt)===day)&&match(h));
  if(view==="done"){
    $("day").value=day||"";$("all").className="btn sm"+(day?"":" pri");$("tdy").className="btn sm"+(day===td?" pri":"");
    $("cnt").textContent=day?`${shownDone.length} việc ngày ${day.split("-").reverse().join("/")}`:`${shownDone.length} việc`;$("clr").hidden=!shownDone.length;
  }
  let data;
  if(view==="open"){data=sorted(tasks.filter(match));const drag=ui.sort==="manual"&&!filt;list.innerHTML=data.map(t=>card(t,false,drag)).join("");list._drag=drag}
  else{data=shownDone;list.innerHTML=data.map(t=>card(t,true,false)).join("")}
  const e=$("empty");e.hidden=data.length>0;
  e.innerHTML=filt?"<big>🔎</big>Không có việc nào khớp bộ lọc.":view==="open"?"<big>✨</big>Chưa có việc nào. Nhập vào ô phía trên để thêm nhé!":"<big>📭</big>"+(day?"Ngày này chưa hoàn thành việc nào.":"Chưa có việc nào hoàn thành.");
  animAll=false;freshId=null;
}
function finishTask(id){
  const i=tasks.findIndex(t=>t.id===id),t=tasks[i];if(!t)return;
  tasks.splice(i,1);history.unshift({...t,doneAt:Date.now()});save();render();
  toast("Đã hoàn thành “"+t.title+"”",()=>{history=history.filter(h=>h.id!==id);tasks.splice(Math.min(i,tasks.length),0,t)});
}
// ---- hành động trong danh sách
list.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.dataset.act==="sub")return;
  const li=b.closest("li"),id=li.dataset.id,act=b.dataset.act;
  if(act==="done"){li.classList.add("leaving");setTimeout(()=>finishTask(id),260);
  }else if(act==="del"){
    const inO=tasks.findIndex(t=>t.id===id),arr=inO>=0?tasks:history,i=inO>=0?inO:history.findIndex(t=>t.id===id),t=arr[i];
    arr.splice(i,1);save();render();toast("Đã xóa “"+t.title+"”",()=>{arr.splice(Math.min(i,arr.length),0,t)});
  }else if(act==="reopen"){
    const i=history.findIndex(t=>t.id===id),t=history.splice(i,1)[0];delete t.doneAt;tasks.push(t);freshId=id;save();render();
  }else if(act==="edit")openModal(id);
});
list.addEventListener("change",e=>{
  if(e.target.dataset.act!=="sub")return;
  const id=e.target.closest("li").dataset.id,t=tasks.find(x=>x.id===id);if(!t)return;
  const s=t.subs.find(x=>x.id===e.target.dataset.sid);s.done=e.target.checked;save();render();
});
list.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".h");if(!h||!list._drag)return;
  e.preventDefault();const li=h.closest("li");h.setPointerCapture(e.pointerId);li.classList.add("dragging");
  const mv=ev=>{const nx=[...list.children].filter(x=>x!==li).find(s=>{const r=s.getBoundingClientRect();return ev.clientY<r.top+r.height/2});list.insertBefore(li,nx||null)};
  const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);li.classList.remove("dragging");
    const o=[...list.children].map(x=>x.dataset.id);tasks.sort((a,b)=>o.indexOf(a.id)-o.indexOf(b.id));save()};
  h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
});
// ---- thêm nhanh
function quick(){const v=$("q").value.trim();if(!v){$("q").focus();return}
  const t={id:uid(),num:++counter,title:v,desc:"",pri:1,cat:"",due:"",dueTime:"",by:ui.by,subs:[],created:Date.now()};tasks.push(t);freshId=t.id;view="open";$("q").value="";save();render()}
$("qAdd").onclick=quick;$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();quick()}});
$("qMore").onclick=()=>{const v=$("q").value.trim();$("q").value="";openModal(null,v)};
// ---- modal
function segs(){$("mp").innerHTML=PRI.map((p,i)=>`<button type="button" data-p="${i}" class="${i===mPri?"on":""}" style="--c:${p[1]}">${p[0]}</button>`).join("")}
function subsUI(){$("ms").innerHTML=mSubs.map((s,i)=>`<div class="srow"><input type="checkbox" data-i="${i}" ${s.done?"checked":""}><input type="text" data-t="${i}" value="${esc(s.text)}" maxlength="100"><button type="button" data-r="${i}">×</button></div>`).join("")}
function openModal(id,title){
  editId=id;const t=id?tasks.find(x=>x.id===id):null;
  $("mh").textContent=t?"Sửa việc":"Việc mới";$("mt").value=t?t.title:(title||"");$("md").value=t?t.desc:"";
  mPri=t?t.pri:1;$("mc").value=t?t.cat:"";$("mdue").value=t?t.due:"";$("mtime").value=t?t.dueTime:"";$("mby").value=t?t.by:(ui.by||"");
  $("bys").innerHTML=[...new Set([...tasks,...history].map(x=>x.by).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("");mSubs=t?t.subs.map(s=>({...s})):[];
  segs();subsUI();$("modal").hidden=false;setTimeout(()=>$("mt").focus(),30);
}
const closeModal=()=>$("modal").hidden=true;
$("mp").onclick=e=>{const b=e.target.closest("[data-p]");if(b){mPri=+b.dataset.p;segs()}};
$("ms").addEventListener("change",e=>{if(e.target.dataset.i!=null)mSubs[+e.target.dataset.i].done=e.target.checked});
$("ms").addEventListener("input",e=>{if(e.target.dataset.t!=null)mSubs[+e.target.dataset.t].text=e.target.value});
$("ms").onclick=e=>{const b=e.target.closest("[data-r]");if(b){mSubs.splice(+b.dataset.r,1);subsUI()}};
$("msn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const v=e.target.value.trim();if(v){mSubs.push({id:uid(),text:v,done:false});e.target.value="";subsUI()}}});
function saveModal(){
  const title=$("mt").value.trim();if(!title){$("mt").focus();return}
  let due=$("mdue").value,dt=$("mtime").value;if(dt&&!due)due=dk(Date.now());if(!due)dt="";
  const pend=$("msn").value.trim();if(pend)mSubs.push({id:uid(),text:pend,done:false});
  const data={title,desc:$("md").value.trim(),pri:mPri,cat:$("mc").value,by:$("mby").value.trim(),due,dueTime:dt,subs:mSubs.filter(s=>s.text.trim())};
  if(data.by)ui.by=data.by;
  if(editId){Object.assign(tasks.find(x=>x.id===editId),data);freshId=editId}
  else{const t={id:uid(),num:++counter,created:Date.now(),...data};tasks.push(t);freshId=t.id}
  view="open";closeModal();save();render();
}
$("mok").onclick=saveModal;$("mx").onclick=closeModal;
$("modal").addEventListener("pointerdown",e=>{if(e.target===$("modal"))closeModal()});
$("mt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();saveModal()}});
// ---- thanh công cụ
$("vOpen").onclick=()=>{view="open";animAll=true;render()};$("vDone").onclick=()=>{view="done";animAll=true;render()};
$("s").oninput=e=>{Q=e.target.value.trim().toLowerCase();render()};
$("fp").onchange=e=>{fP=e.target.value;render()};$("fc").onchange=e=>{fC=e.target.value;render()};
$("so").onchange=e=>{ui.sort=e.target.value;save();animAll=true;render()};
$("fx").onclick=()=>{Q=fP=fC="";$("s").value=$("fp").value=$("fc").value="";render()};
const shift=n=>{const d=day?new Date(day+"T00:00:00"):new Date();d.setDate(d.getDate()+n);day=dk(d.getTime());animAll=true;render()};
$("day").onchange=e=>{day=e.target.value||null;animAll=true;render()};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);$("tdy").onclick=()=>{day=dk(Date.now());animAll=true;render()};$("all").onclick=()=>{day=null;animAll=true;render()};
$("clr").onclick=()=>{const ids=new Set(history.filter(h=>(!day||dk(h.doneAt)===day)&&match(h)).map(h=>h.id));
  if(ids.size&&confirm("Xóa "+ids.size+" việc đã hoàn thành đang hiển thị?")){history=history.filter(h=>!ids.has(h.id));save();render()}};
$("theme").onclick=()=>{const r=document.documentElement,n=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("theme-v1",n)}catch(e){}};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({tasks,history,counter},null,1)],{type:"application/json"}));a.download="tasks-backup-"+dk(Date.now())+".json";a.click();URL.revokeObjectURL(a.href);toast("Đã tải file sao lưu")};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.history))throw 0;
    if(!confirm("Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?"))return;
    tasks=d.tasks;history=d.history;counter=d.counter||0;[...tasks,...history].forEach(x=>{x.num||(x.num=++counter);x.created||(x.created=Date.now());x.pri??(x.pri=1);x.cat??(x.cat="");x.due??(x.due="");x.dueTime??(x.dueTime="");x.by??(x.by="");x.subs??(x.subs=[])});
    save();animAll=true;render();toast("Đã khôi phục dữ liệu")}catch(x){toast("File không hợp lệ")}};r.readAsText(f);e.target.value=""};
// ---- phím tắt
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();$("smodal").hidden=true}
  if(!$("modal").hidden&&(e.ctrlKey||e.metaKey)&&e.key==="Enter")saveModal();
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(typing||!$("modal").hidden||!$("smodal").hidden||e.ctrlKey||e.metaKey)return;
  if(e.key==="n"||e.key==="N"){e.preventDefault();openModal(null)}
  if(e.key==="/"){e.preventDefault();$("s").focus()}
});
// ---- nhắc việc
const hasN="Notification" in window;
function topTasks(n){return [...tasks].sort((a,b)=>(isOver(b)-isOver(a))||dkey(a).localeCompare(dkey(b))||b.pri-a.pri).slice(0,n)}
function showPop(t){
  const box=$("pops");if(box.querySelector(`[data-pid="${t.id}"]`))return;
  const d=document.createElement("div");d.className="pop";d.dataset.pid=t.id;d.style.setProperty("--pc",PRI[t.pri][1]);
  const l=t.due?dueInfo(t.due,t.dueTime)[1]:"",m=[t.by?"👤 "+esc(t.by):"",esc(l)].filter(Boolean).join(" · ");
  d.innerHTML=`<button class="px" aria-label="Đóng">×</button><div class="pt">⏰ Việc chưa hoàn thành</div><div class="pn">${esc(t.title)}</div>${m?`<div class="pm">${m}</div>`:""}<div class="pa"><button class="btn sm pri" data-pa="done">Hoàn thành</button><button class="btn sm" data-pa="later">Để sau</button></div>`;
  const kill=()=>{d.classList.add("out");setTimeout(()=>d.remove(),300)};
  d.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.pa==="done")finishTask(t.id);kill()};
  box.appendChild(d);setTimeout(kill,12000);
}
function remind(){
  if(!tasks.length)return;const top=topTasks(3);
  if(document.hidden){
    if(ui.sys&&hasN&&Notification.permission==="granted"){
      const n=new Notification("Còn "+tasks.length+" việc chưa hoàn thành",{body:top.map(t=>"• "+t.title).join("\n"),tag:"task-remind"});
      n.onclick=()=>{window.focus();n.close()};
    }
  }else top.forEach(showPop);
}
let remT;const schedule=()=>{clearInterval(remT);if(ui.int>0)remT=setInterval(remind,ui.int*1000)};
function sysStatus(){$("ssys").textContent=!hasN?"Trình duyệt không hỗ trợ":Notification.permission==="denied"?"Đang bị chặn trong cài đặt trình duyệt":(Notification.permission==="granted"&&ui.sys)?"✓ Đã bật":"Chưa bật"}
$("bell").onclick=()=>{$("sname").value=ui.by||"";$("sint").value=String(ui.int);sysStatus();$("smodal").hidden=false};
$("ssysbtn").onclick=async()=>{
  if(!hasN)return;let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();
  ui.sys=p==="granted";save();sysStatus();if(ui.sys)new Notification("Đã bật thông báo",{body:"Bạn sẽ được nhắc khi đang ở tab khác."});
};
$("stest").onclick=()=>{$("smodal").hidden=true;const t=topTasks(1)[0];t?showPop(t):toast("Chưa có việc nào để nhắc")};
$("sx").onclick=()=>$("smodal").hidden=true;
$("sok").onclick=()=>{ui.by=$("sname").value.trim();ui.int=+$("sint").value;save();schedule();$("smodal").hidden=true;toast(ui.int?"Đã lưu. Nhắc việc mỗi "+(ui.int<60?ui.int+" giây":ui.int<3600?ui.int/60+" phút":"1 giờ"):"Đã lưu. Đã tắt nhắc việc")};
$("smodal").addEventListener("pointerdown",e=>{if(e.target===$("smodal"))$("smodal").hidden=true});
schedule();
setInterval(()=>{if(!document.querySelector(".dragging"))render()},60000);
render();
</script>
</body>
</html>
