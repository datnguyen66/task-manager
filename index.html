<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý công việc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✅%3C/text%3E%3C/svg%3E">
<script>document.documentElement.dataset.theme="dark";try{document.documentElement.dataset.theme=localStorage.getItem("theme-v1")||"dark"}catch(e){}</script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mu:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef0f4;--sh:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme=dark]{--bg:#0e1013;--card:#16191e;--tx:#e6e8ec;--mu:#8a919c;--bd:#262a31;--ac:#4f8cff;--ok:#3fb27f;--warn:#e5a04a;--bad:#ef6b6b;--soft:#1d2127;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .25s;-webkit-font-smoothing:antialiased}
.app{max-width:780px;margin:0 auto;padding:36px 20px 90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.hs{margin:4px 0 0;color:var(--mu);font-size:14px}
.tools{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--mu);display:grid;place-items:center;transition:.15s;padding:0}
.ib:hover{color:var(--tx);border-color:var(--bd);background:var(--card)}
.ib svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:20px;box-shadow:var(--sh)}
.st{padding:14px 18px;border-left:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.st:first-child{border-left:0}
.st b{display:block;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{display:block;color:var(--mu);font-size:13px;margin-top:2px;line-height:1.3}
.st.bad b{color:var(--bad)}
.quick{display:flex;gap:8px;margin-bottom:22px}
.quick input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);transition:.15s}
.quick input:focus,.fld:focus,.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.btn{padding:9px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:500;transition:.15s}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.sm{padding:6px 13px;font-size:13.5px;border-radius:8px}
.quick .btn{height:46px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 0;color:var(--mu);font-weight:500;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fld{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
#s{flex:1;min-width:150px}
.dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dbar .cnt{margin-left:auto;color:var(--mu);font-size:13px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 14px 16px 10px;box-shadow:var(--sh);transition:transform .2s,opacity .28s,border-color .2s}
.card.hi{border-left:3px solid var(--pc)}
.card:hover{border-color:color-mix(in srgb,var(--tx) 25%,var(--bd))}
.card.hi:hover{border-left-color:var(--pc)}
.card.fresh{animation:in .3s both}
.card.leaving{opacity:0;transform:translateX(28px)}
.card.dragging{box-shadow:0 14px 34px rgba(0,0,0,.25);outline:1px solid var(--ac);position:relative;z-index:3;transform:scale(1.01)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.h{cursor:grab;color:var(--mu);touch-action:none;user-select:none;padding:2px;opacity:.4;line-height:1.5}
.card:hover .h{opacity:1}
.ck{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--mu);background:none;margin-top:1px;display:grid;place-items:center;transition:.15s;padding:0;color:#fff}
.ck:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ck.on{background:var(--ok);border-color:var(--ok);cursor:default}
.ck svg{width:15px;height:15px;stroke-width:2.6}
.main{flex:1;min-width:0}
.ttl{font-weight:600;font-size:17px;line-height:1.35;word-break:break-word}
.card.done .ttl{color:var(--mu);text-decoration:line-through}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bdg{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;line-height:1.4;padding:2px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.bdg svg{width:15px;height:15px}
.bdg.pr,.bdg.over,.bdg.today{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.bdg.over{--c:var(--bad)}.bdg.today{--c:var(--warn)}
.desc{color:var(--mu);font-size:14.5px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.subs{margin-top:10px}
.prog{height:3px;background:var(--soft);border-radius:9px;overflow:hidden;max-width:240px;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.sub{display:flex;gap:9px;align-items:center;font-size:14.5px;padding:2px 0}
.sub input{accent-color:var(--ac);width:16px;height:16px;margin:0}
.sub.d span{text-decoration:line-through;color:var(--mu)}
.acts{display:flex;gap:8px;flex:none}
.acts button{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);transition:.15s;padding:0}
.acts .x{color:var(--bad)}
.acts button:hover{background:color-mix(in srgb,currentColor 10%,var(--card));border-color:currentColor}
.acts svg{width:22px;height:22px;display:block}
.empty{text-align:center;padding:60px 16px;color:var(--mu);font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:20;animation:fade .15s}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:540px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:in .2s}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:700}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:14px 0 6px}
.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal textarea,.modal select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.modal textarea{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-weight:500;font-size:14px;transition:.15s}
.seg button.on{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:var(--c);color:var(--c);font-weight:600}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.srow input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac);flex:none}
.srow button{border:0;background:none;color:var(--mu);font-size:20px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:10px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30;animation:in .2s;font-size:14px}
.toast button{background:none;border:0;color:#7aa7ff;font-weight:600}
.pops{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:40;width:min(340px,calc(100vw - 32px));pointer-events:none}
.pop{pointer-events:auto;position:relative;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--pc,var(--ac));border-radius:10px;padding:13px 34px 13px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:slideL .35s cubic-bezier(.2,.9,.3,1.1);transition:opacity .3s,transform .3s}
.pop.out{opacity:0;transform:translateX(-120%)}
.pop .px{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mu);font-size:20px;line-height:1}
.pt{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn);margin-bottom:3px}
.pt svg,.pm svg{width:14px;height:14px}
.pm svg{vertical-align:-2px;margin-right:4px}
.pn{font-weight:600;word-break:break-word}
.pm{color:var(--mu);font-size:13px;margin-top:2px}
.pa{display:flex;gap:6px;margin-top:10px}
@keyframes slideL{from{opacity:0;transform:translateX(-120%)}}
.fl{display:flex;flex-direction:column;gap:8px}
.fl .pop{animation:none;padding-right:14px;box-shadow:none}
.flh{font-weight:600;font-size:13px;color:var(--mu);margin:0 2px 10px}
.nbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:14px}
[hidden]{display:none!important}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.st:nth-child(3){border-left:0}.st:nth-child(n+3){border-top:1px solid var(--bd)}.quick .btn:nth-child(3){display:none}h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Quản lý công việc</h1><p class="hs" id="sub"></p></div>
    <div class="tools">
      <button class="ib" id="bell" title="Cài đặt nhắc việc">🔔</button>
      <button class="ib" id="theme" title="Đổi sáng/tối">◐</button>
      <button class="ib" id="exp" title="Sao lưu ra file">⤓</button>
      <button class="ib" id="imp" title="Khôi phục từ file">⤒</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
  <div class="nbar" id="nbar" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="quick">
    <input id="q" placeholder="Thêm nhanh một việc rồi nhấn Enter…  (phím tắt: N)" maxlength="120" autocomplete="off">
    <button class="btn pri" id="qAdd">Thêm</button>
    <button class="btn" id="qMore">Chi tiết</button>
  </div>
  <div class="tabs"><button id="vOpen" class="on"></button><button id="vDone"></button></div>
  <div class="filters">
    <input class="fld" id="s" placeholder="Tìm kiếm  ( / )">
    <select class="fld" id="fp"><option value="">Mọi ưu tiên</option><option value="3">Gấp</option><option value="2">Cao</option><option value="1">Vừa</option><option value="0">Thấp</option></select>
    <select class="fld" id="fc"></select>
    <select class="fld" id="so"><option value="manual">Thứ tự kéo thả</option><option value="due">Theo hạn chót</option><option value="pri">Theo ưu tiên</option><option value="new">Mới nhất</option></select>
    <button class="btn sm" id="fx" hidden>Xóa lọc</button>
  </div>
  <div class="dbar" id="dbar" hidden>
    <button class="btn sm" id="prev">‹</button><input class="fld" type="date" id="day" style="padding:4px 8px">
    <button class="btn sm" id="next">›</button><button class="btn sm" id="tdy">Hôm nay</button><button class="btn sm" id="all">Tất cả</button>
    <span class="cnt" id="cnt"></span><button class="btn sm" id="clr">Xóa</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2 id="mh">Việc mới</h2>
    <label>Tiêu đề</label><input type="text" id="mt" maxlength="120" placeholder="Bạn cần làm gì?">
    <label>Miêu tả chi tiết</label><textarea id="md" maxlength="1500" placeholder="Ghi chú, link, yêu cầu…"></textarea>
    <label>Mức ưu tiên</label><div class="seg" id="mp"></div>
    <div class="g2"><div><label>Phân loại</label><select id="mc"></select></div><div><label>Người thêm</label><input type="text" id="mby" list="bys" maxlength="40" placeholder="Tên người thêm"></div></div><datalist id="bys"></datalist>
    <div class="g2"><div><label>Hạn chót (ngày)</label><input type="date" id="mdue"></div><div><label>Giờ hạn chót</label><input type="time" id="mtime"></div></div>
    <label>Việc con (checklist)</label><div id="ms"></div>
    <input type="text" id="msn" placeholder="+ Thêm việc con rồi nhấn Enter" maxlength="100">
    <div class="foot"><button class="btn" id="mx">Hủy</button><button class="btn pri" id="mok">Lưu</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="pops" id="pops"></div>
<div class="modal" id="smodal" hidden>
  <div class="sheet">
    <h2>Cài đặt nhắc việc</h2>
    <label>Tên của bạn (tự điền vào mục “Người thêm”)</label>
    <input type="text" id="sname" maxlength="40" placeholder="Ví dụ: Đạt">
    <label>Popup nhắc việc chưa hoàn thành</label>
    <select id="sint"><option value="0">Tắt</option><option value="30">Mỗi 30 giây</option><option value="60">Mỗi 1 phút</option><option value="300">Mỗi 5 phút</option><option value="900">Mỗi 15 phút</option><option value="1800">Mỗi 30 phút</option><option value="3600">Mỗi 1 giờ</option></select>
    <label>Thông báo ra màn hình máy tính (khi bạn dùng tab hoặc phần mềm khác)</label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" id="ssysbtn" type="button">Bật thông báo</button><button class="btn sm" id="ssystest" type="button">Gửi thử</button><span id="ssys" style="color:var(--mu);font-size:13px"></span></div>
    <label>Cửa sổ nổi luôn trên cùng (Chrome/Edge trên máy tính)</label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" id="sfloat" type="button">Mở cửa sổ nổi</button><span style="color:var(--mu);font-size:13px">Kéo cửa sổ này sang góc trái màn hình, nó sẽ nổi trên mọi phần mềm khác.</span></div>
    <div class="foot"><button class="btn" id="stest" type="button">Xem thử</button><button class="btn" id="sx" type="button">Đóng</button><button class="btn pri" id="sok" type="button">Lưu</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),list=$("list");
const PRI=[["Thấp","var(--mu)"],["Vừa","var(--mu)"],["Cao","var(--warn)"],["Gấp","var(--bad)"]];
const CAT={work:["Công việc","#47607d"],me:["Cá nhân","#8a6a3b"],study:["Học tập","#7a4f6a"],health:["Sức khỏe","#55775d"],other:["Khác","#8a857b"]};
const SV=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const IC={edit:SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),del:SV('<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/>'),re:SV('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
clock:SV('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),user:SV('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>'),check:SV('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
bell:SV('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>'),moon:SV('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'),
down:SV('<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>'),up:SV('<path d="M12 17V5"/><path d="M7 9l5-5 5 5"/><path d="M5 21h14"/>')};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
let tasks=load("tasks-v2",[]),history=load("history-v2",[]),counter=load("counter-v3",0),ui=load("ui-v1",{sort:"manual"});
let pip=null,view="open",day=dk(Date.now()),Q="",fP="",fC="",animAll=true,freshId=null,editId=null,mPri=1,mSubs=[],tmr;
[...tasks,...history].forEach(x=>{x.num||(x.num=++counter);x.created||(x.created=x.doneAt||Date.now());x.pri??(x.pri=1);x.cat??(x.cat="");x.due??(x.due="");x.dueTime??(x.dueTime="");x.by??(x.by="");x.subs??(x.subs=[])});
function save(){try{localStorage.setItem("tasks-v2",JSON.stringify(tasks));localStorage.setItem("history-v2",JSON.stringify(history));localStorage.setItem("counter-v3",JSON.stringify(counter));localStorage.setItem("ui-v1",JSON.stringify(ui))}catch(e){}}
ui.int??(ui.int=30);ui.by??(ui.by="");save();
$("so").value=ui.sort||"manual";
$("fc").innerHTML='<option value="">Mọi phân loại</option>'+Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
$("mc").innerHTML='<option value="">Không phân loại</option>'+Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");

function toast(msg,undo){
  const t=$("toast");clearTimeout(tmr);t.hidden=false;t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button>Hoàn tác</button>':"");
  if(undo)t.querySelector("button").onclick=()=>{undo();t.hidden=true;save();render()};
  tmr=setTimeout(()=>t.hidden=true,5000);
}
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const isOver=t=>!!t.due&&(t.due<dk(Date.now())||(t.due===dk(Date.now())&&!!t.dueTime&&t.dueTime<nowHM()));
function dueInfo(due,time){
  const a=new Date(due+"T00:00:00"),b=new Date(dk(Date.now())+"T00:00:00"),n=Math.round((a-b)/864e5),tm=time?" "+time:"";
  if(n<0)return["over","Quá hạn "+(-n)+" ngày"];
  if(n===0)return[isOver({due,dueTime:time})?"over":"today",(isOver({due,dueTime:time})?"Quá hạn từ ":"Hôm nay ")+(time||"")];
  if(n===1)return["plain","Ngày mai"+tm];
  return["plain",due.split("-").reverse().slice(0,2).join("/")+tm];
}
const hm=ts=>new Date(ts).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"});
function match(t){
  if(fP!==""&&String(t.pri)!==fP)return false;
  if(fC&&t.cat!==fC)return false;
  if(Q){const h=(t.title+" "+t.desc+" "+(t.by||"")+" "+t.subs.map(s=>s.text).join(" ")).toLowerCase();if(!h.includes(Q))return false}
  return true;

$("smodal").addEventListener("pointerdown",e=>{if(e.target===$("smodal"))$("smodal").hidden=true});
schedule();updateNbar();
setInterval(()=>{if(!document.querySelector(".dragging"))render()},60000);
$("bell").innerHTML=IC.bell;$("theme").innerHTML=IC.moon;$("exp").innerHTML=IC.down;$("imp").innerHTML=IC.up;
render();
</script>
</body>
</html>
