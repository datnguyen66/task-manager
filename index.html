<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✅%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--sub:#f6f8fa;--bd:#d0d7de;--fg:#1f2328;--mu:#656d76;--ac:#0969da;--btn:#1f883d;--btnh:#1a7f37;--open:#1a7f37;--closed:#8250df;--hd:#24292f;--dng:#cf222e;--hov:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--sub:#161b22;--bd:#30363d;--fg:#e6edf3;--mu:#7d8590;--ac:#4493f8;--btn:#238636;--btnh:#2ea043;--open:#3fb950;--closed:#a371f7;--hd:#010409;--dng:#f85149;--hov:#161b22;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--hd);color:#f0f6fc;padding:calc(16px + env(safe-area-inset-top,0)) 16px 16px;display:flex;align-items:center;gap:12px}
header svg{fill:#f0f6fc}
header b{font-weight:600;font-size:16px}
header span{color:#9198a1}
.wrap{max-width:1012px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:24px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--mu);font-weight:300}
.btn{font:inherit;font-size:14px;font-weight:500;padding:5px 16px;border-radius:6px;border:1px solid var(--bd);background:var(--sub);color:var(--fg);cursor:pointer;line-height:20px}
.btn:hover{background:var(--hov)}
.btn.g{background:var(--btn);border-color:rgba(31,35,40,.15);color:#fff}
.btn.g:hover{background:var(--btnh)}
.btn.sm{padding:3px 12px;font-size:12px}
.btn.d:hover{color:var(--dng)}
.box{border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--bg)}
.bh{background:var(--sub);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:16px;align-items:center}
.bh button{background:none;border:0;font:inherit;font-weight:600;color:var(--mu);cursor:pointer;display:flex;gap:6px;align-items:center;padding:0}
.bh button.on{color:var(--fg)}
.bh button:hover{color:var(--fg)}
.bh .sp{flex:1}
.bh small{color:var(--mu);font-size:12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;padding:8px 16px 8px 8px;border-top:1px solid var(--bd);align-items:flex-start}
li:first-child{border-top:0}
li:hover{background:var(--hov)}
li.dragging{background:var(--sub);box-shadow:0 8px 24px rgba(1,4,9,.25);outline:1px solid var(--ac);position:relative}
.h{cursor:grab;color:var(--mu);touch-action:none;user-select:none;padding:4px 4px;opacity:.5;line-height:1.3}
li:hover .h{opacity:1}
.ic{padding:6px 0 0 0;flex:none}
.ic svg{display:block}
.mid{flex:1;min-width:0;padding:2px 0}
.t{font-weight:600;font-size:16px;word-break:break-word}
.d{color:var(--mu);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.meta{color:var(--mu);font-size:12px;margin-top:4px}
.act{display:flex;gap:6px;flex:none;padding-top:2px}
.empty{padding:56px 16px;text-align:center}
.empty svg{fill:var(--mu);margin-bottom:8px}
.empty h3{margin:0 0 4px;font-size:20px;font-weight:600}
.empty p{margin:0;color:var(--mu)}
.new{border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:16px;background:var(--bg)}
.new label{display:block;font-weight:600;margin-bottom:6px}
.new input,.new textarea{width:100%;font:inherit;padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:14px}
.new textarea{min-height:140px;resize:vertical;padding:8px 12px}
.new input:focus,.new textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
.row{display:flex;justify-content:flex-end;gap:8px}
.dbar{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.dbar input{font:inherit;padding:3px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
.dbar .cnt{color:var(--mu);font-size:12px;margin-left:auto}
.btn.on{border-color:var(--ac);color:var(--ac)}
[hidden]{display:none!important}
@media (max-width:540px){.act .btn span{display:none}}
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm3.28 3.72a.75.75 0 0 1 0 1.06l-4 4a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06L6.75 8.69l3.47-3.47a.75.75 0 0 1 1.06 0Z"/></svg>
  <span><b style="color:#f0f6fc">Việc hôm nay</b> <span>/ tasks</span></span>
</header>

<div class="wrap">
  <div class="top">
    <h1>Tasks <em id="today"></em></h1>
    <button class="btn g" id="newBtn" type="button">New task</button>
  </div>

  <div class="new" id="newBox" hidden>
    <label for="title">Add a title</label>
    <input id="title" type="text" placeholder="Title" maxlength="120" autocomplete="off">
    <label for="desc">Add a description</label>
    <textarea id="desc" placeholder="Leave a description (optional)" maxlength="1000"></textarea>
    <div class="row">
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn g" id="submit" type="button">Submit new task</button>
    </div>
  </div>

  <div class="box">
    <div class="bh">
      <button id="vOpen" class="on" type="button"></button>
      <button id="vClosed" type="button"></button>
      <span class="sp"></span>
      <small id="hint">Kéo ⋮⋮ để sắp xếp</small>
      <button class="btn sm d" id="clr" type="button" hidden>Clear closed</button>
    </div>
    <div class="dbar" id="dbar" hidden>
      <button class="btn sm" id="prev" type="button" title="Ngày trước">‹</button>
      <input type="date" id="day">
      <button class="btn sm" id="next" type="button" title="Ngày sau">›</button>
      <button class="btn sm" id="tdy" type="button">Hôm nay</button>
      <button class="btn sm" id="all" type="button">Tất cả</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), list=$("list");
function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}}
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let day=dk(Date.now());
let tasks=load("tasks-v2",[]), history=load("history-v2",[]), counter=load("counter-v3",0), view="open";
// gán số thứ tự (#) cho dữ liệu cũ
[...tasks,...history].forEach(x=>{if(!x.num)x.num=++counter;if(!x.created)x.created=x.doneAt||Date.now()});
function save(){try{localStorage.setItem("tasks-v2",JSON.stringify(tasks));localStorage.setItem("history-v2",JSON.stringify(history));localStorage.setItem("counter-v3",JSON.stringify(counter))}catch(e){}}
save();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
$("today").textContent=new Date().toLocaleDateString("vi-VN",{day:"numeric",month:"numeric",year:"numeric"});

const OPEN='<svg width="16" height="16" viewBox="0 0 16 16" fill="var(--open)"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>';
const CLOSED='<svg width="16" height="16" viewBox="0 0 16 16" fill="var(--closed)"><path d="M11.28 6.78a.75.75 0 0 0-1.06-1.06L7.25 8.69 5.78 7.22a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l3.5-3.5Z"/><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0Zm-1.5 0a6.5 6.5 0 1 0-13 0 6.5 6.5 0 0 0 13 0Z"/></svg>';

function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return"vừa xong";
  const m=Math.floor(s/60);if(m<60)return m+" phút trước";
  const h=Math.floor(m/60);if(h<24)return h+" giờ trước";
  const d=Math.floor(h/24);if(d<30)return d+" ngày trước";
  return new Date(ts).toLocaleDateString("vi-VN");
}
const hm=ts=>new Date(ts).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric",year:"numeric"});

function row(x,closed){
  const li=document.createElement("li");li.dataset.id=x.id;
  li.innerHTML=(closed?'':'<span class="h" title="Kéo để sắp xếp">⋮⋮</span>')+'<span class="ic"></span><div class="mid"><div class="t"></div><div class="d"></div><div class="meta"></div></div><div class="act"></div>';
  if(closed)li.style.paddingLeft="16px";
  li.querySelector(".ic").innerHTML=closed?CLOSED:OPEN;
  li.querySelector(".t").textContent=x.title;
  const d=li.querySelector(".d");if(x.desc)d.textContent=x.desc;else d.remove();
  li.querySelector(".meta").textContent=closed?`#${x.num} đã đóng lúc ${hm(x.doneAt)}`:`#${x.num} mở ${ago(x.created)}`;
  const act=li.querySelector(".act");
  if(!closed){
    act.innerHTML='<button class="btn sm" type="button" title="Đánh dấu hoàn thành">✓ <span>Close</span></button><button class="btn sm d" type="button" title="Xóa">🗑</button>';
    act.children[0].onclick=()=>{tasks=tasks.filter(t=>t.id!==x.id);history.unshift({...x,doneAt:Date.now()});save();render()};
    act.children[1].onclick=()=>{if(confirm("Xóa task này?")){tasks=tasks.filter(t=>t.id!==x.id);save();render()}};
    li.querySelector(".h").addEventListener("pointerdown",e=>startDrag(e,li));
  }else{
    act.innerHTML='<button class="btn sm" type="button">↺ <span>Reopen</span></button><button class="btn sm d" type="button" title="Xóa">🗑</button>';
    act.children[0].onclick=()=>{history=history.filter(t=>t.id!==x.id);const{doneAt,...r}=x;tasks.push(r);save();render()};
    act.children[1].onclick=()=>{history=history.filter(t=>t.id!==x.id);save();render()};
  }
  return li;
}

function render(){
  $("vOpen").innerHTML=OPEN+` ${tasks.length} Open`;
  $("vClosed").innerHTML=CLOSED+` ${history.length} Closed`;
  $("vOpen").className=view==="open"?"on":"";
  $("vClosed").className=view==="closed"?"on":"";
  $("hint").hidden=view!=="open"||!tasks.length;
  const shown=day?history.filter(h=>dk(h.doneAt)===day):history;
  $("clr").hidden=view!=="closed"||!shown.length;
  $("clr").textContent=day?"Clear this day":"Clear all";
  $("dbar").hidden=view!=="closed";
  $("day").value=day||"";
  $("all").className="btn sm"+(day?"":" on");
  $("tdy").className="btn sm"+(day===dk(Date.now())?" on":"");
  $("cnt").textContent=day?`${shown.length} task đóng ngày ${day.split("-").reverse().join("/")}`:`${shown.length} task đã đóng`;
  list.innerHTML="";
  const data=view==="open"?tasks:shown;
  data.forEach(x=>list.appendChild(row(x,view==="closed")));
  const e=$("empty");e.hidden=data.length>0;
  e.innerHTML=view==="open"
    ?'<svg width="24" height="24" viewBox="0 0 16 16"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg><h3>No open tasks</h3><p>Bấm “New task” để thêm việc cần làm.</p>'
    :'<svg width="24" height="24" viewBox="0 0 16 16"><path d="M11.28 6.78a.75.75 0 0 0-1.06-1.06L7.25 8.69 5.78 7.22a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l3.5-3.5Z"/><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0Zm-1.5 0a6.5 6.5 0 1 0-13 0 6.5 6.5 0 0 0 13 0Z"/></svg><h3>No closed tasks</h3><p>'+(day?'Không có task nào hoàn thành trong ngày này.':'Các task đã hoàn thành sẽ nằm ở đây.')+'</p>';
}

function startDrag(e,li){
  e.preventDefault();const h=e.currentTarget;h.setPointerCapture(e.pointerId);li.classList.add("dragging");
  const move=ev=>{
    const next=[...list.children].filter(x=>x!==li).find(s=>{const r=s.getBoundingClientRect();return ev.clientY<r.top+r.height/2});
    list.insertBefore(li,next||null);
  };
  const up=()=>{
    h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
    li.classList.remove("dragging");
    const order=[...list.children].map(x=>x.dataset.id);
    tasks.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));save();
  };
  h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
}

function toggleNew(show){$("newBox").hidden=!show;if(show){view="open";render();$("title").focus()}}
function addTask(){
  const t=$("title").value.trim();
  if(!t){$("title").focus();return}
  tasks.push({id:uid(),num:++counter,title:t,desc:$("desc").value.trim(),created:Date.now()});
  $("title").value="";$("desc").value="";toggleNew(false);save();render();
}
$("newBtn").onclick=()=>toggleNew(true);
$("cancel").onclick=()=>toggleNew(false);
$("submit").onclick=addTask;
$("title").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTask()}});
$("vOpen").onclick=()=>{view="open";render()};
$("vClosed").onclick=()=>{view="closed";render()};
$("clr").onclick=()=>{
  const ids=new Set((day?history.filter(h=>dk(h.doneAt)===day):history).map(h=>h.id));
  if(ids.size&&confirm(day?"Xóa các task đã đóng của ngày này?":"Xóa toàn bộ task đã đóng?")){history=history.filter(h=>!ids.has(h.id));save();render()}
};
function shift(n){const d=day?new Date(day+"T00:00:00"):new Date();d.setDate(d.getDate()+n);day=dk(d.getTime());render()}
$("day").onchange=e=>{day=e.target.value||null;render()};
$("prev").onclick=()=>shift(-1);
$("next").onclick=()=>shift(1);
$("tdy").onclick=()=>{day=dk(Date.now());render()};
$("all").onclick=()=>{day=null;render()};
render();
</script>
</body>
</html>
